name: Generate preview limits migration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - uses: actions/upload-artifact@v4
        with:
          name: preview-limits-migration
          path: drizzle/
          retention-days: 7
